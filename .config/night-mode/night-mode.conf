# ==============================================================================
# Night Mode Configuration
# ==============================================================================

# Schedule times in 24-hour format (HH:MM)
# Night mode activates at TIME_ON and turns off at TIME_OFF.
TIME_ON="20:00"     # 8:00 PM
TIME_OFF="06:00"    # 6:00 AM

# Screen Color Temperature (in Kelvin)
# 6500K is standard cool daylight.
# 4000K is a warm white (reduces blue light and eye strain).
# 3500K is warmer/candle-like.
TEMP_DAY="6500"
TEMP_NIGHT="4000"

# Transition duration in seconds
# e.g., 900 = 15 minutes gradual smooth transition.
# 0 = instantaneous change at the exact minute.
DURATION="900"

# Gamma level (default 1.0)
GAMMA="1.0"

# Automatically switch GTK / desktop application color-scheme:
# 'prefer-dark' during night hours, 'default' during daytime.
# Set to false if you only want screen color temperature (blue light filter).
TOGGLE_DARK_THEME=true

# Desktop notifications when night mode activates, deactivates, or toggles
NOTIFICATIONS=true
